# ─────────────────────────────────────────────────────
# Employee Management System – Docker Compose
# ─────────────────────────────────────────────────────
# Usage:
#   1. Copy .env.example to .env and fill in secrets
#   2. docker compose up -d
# ─────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────
  db:
    image: postgres:18-alpine
    container_name: ems_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-ems_db}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA:            /var/lib/postgresql/data/pgdata
    # ports:
      # Bind to loopback only — reachable from this host (psql/pgAdmin),
      # never from the network or internet. Do NOT change to 0.0.0.0.
      # - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ems_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ems_network

  # ── ASP.NET Core API ────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ems_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT:                   ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS:                          http://+:8080
      ConnectionStrings__DefaultConnection:     "Host=db;Port=5432;Database=${POSTGRES_DB:-ems_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      JwtSettings__SecretKey:                   ${JWT_SECRET_KEY}
      JwtSettings__Issuer:                      ${JWT_ISSUER:-EmployeeManagement.Api}
      JwtSettings__Audience:                    ${JWT_AUDIENCE:-EmployeeManagement.Client}
      JwtSettings__ExpirationInMinutes:         ${JWT_EXPIRATION_MINUTES:-60}
      Cors__AllowedOrigins__0:                  ${CORS_ORIGIN_0:-http://localhost:3000}
      Cors__AllowedOrigins__1:                  ${CORS_ORIGIN_1:-http://localhost:5173}
      Cors__AllowedOrigins__2:                  ${CORS_ORIGIN_2:-}
      Cors__AllowedOrigins__3:                  ${CORS_ORIGIN_3:-}
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    networks:
      - ems_network

volumes:
  postgres_data:
    driver: local

networks:
  ems_network:
    driver: bridge
